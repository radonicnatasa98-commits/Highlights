<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlights 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fallback per chi non ha Avenir installato -->
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f5;
    --ink: #111;
    --muted: #6b6b6b;
    --font: "Avenir Light", "Avenir Next", "Avenir", "Nunito Sans", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header ---------- */
  header {
    position: fixed; inset: 0 0 auto 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 28px;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    z-index: 20;
  }
  header nav { display: flex; gap: 48px; }
  header a { color: inherit; text-decoration: none; }
  .logo { font-weight: 400; letter-spacing: .2em; }

  /* ---------- Hero title ---------- */
  .intro {
    position: fixed; top: 64px; left: 28px;
    z-index: 5; pointer-events: none;
  }
  h1 {
    font-family: var(--font);
    font-weight: 300;
    font-size: clamp(56px, 10.5vw, 168px);
    line-height: .92;
    letter-spacing: -.02em;
  }
  h1 span { display: block; }
  .intro p {
    margin-top: 22px; max-width: 300px;
    font-size: 13px; line-height: 1.5; color: var(--muted);
  }

  /* ---------- Staircase ---------- */
  .stage { position: fixed; inset: 0; }
  .card {
    position: absolute; bottom: 0; left: 0;
    overflow: hidden; cursor: pointer;
    transform-origin: 0 100%;
    will-change: transform, width, height;
  }
  .card .media {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transition: transform .8s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .media { transform: scale(1.04); }
  .card .num {
    position: absolute; left: 14px; bottom: 12px;
    color: rgba(255,255,255,.9);
    font-size: 12px; letter-spacing: .12em;
  }

  .label {
    position: absolute; left: 0; top: 0;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap; pointer-events: none; z-index: 6;
    transition: opacity .3s;
  }
  .label::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink);
  }

  /* ---------- Detail view ---------- */
  .veil {
    position: fixed; inset: 0; background: #000; opacity: 0;
    pointer-events: none; z-index: 30;
  }
  .detail {
    position: fixed; inset: 0; background: var(--bg);
    z-index: 40; overflow-y: auto; visibility: hidden;
  }
  .detail.open { visibility: visible; }
  .detail-head { padding: 64px 28px 20px; }
  .detail h2 {
    font-weight: 300; font-size: clamp(48px, 9vw, 140px);
    line-height: .95; letter-spacing: -.02em;
  }
  .detail .meta {
    margin-top: 16px; display: flex; gap: 24px;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .detail .meta span::before {
    content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink); margin-right: 8px; vertical-align: middle;
  }
  .detail-hero {
    margin: 0 28px; height: 78vh;
    background-size: cover; background-position: center;
  }
  .detail-body {
    max-width: 560px; margin: 90px auto 120px; padding: 0 28px;
    text-align: center; font-size: 15px; line-height: 1.7; color: var(--muted);
  }
  .detail-body strong {
    display: block; margin-bottom: 28px;
    font-weight: 300; font-size: 28px; line-height: 1.2; color: var(--ink);
    text-transform: uppercase; letter-spacing: .02em;
  }
  .close {
    position: fixed; top: 14px; right: 24px; z-index: 50;
    background: none; border: 0; cursor: pointer;
    font: inherit; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink); padding: 6px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .close.show { opacity: 1; pointer-events: auto; }

  .fly {
    position: fixed; z-index: 45; background-size: cover; background-position: center;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    header nav { gap: 18px; }
    header nav a:nth-child(n+3) { display: none; }
    .intro p { font-size: 12px; max-width: 220px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Highlights</div>
  <nav>
    <a href="#">Progetti</a>
    <a href="#">Archivio</a>
    <a href="#">Info</a>
    <a href="#">Contatti</a>
  </nav>
</header>

<div class="intro">
  <h1><span>Highlights</span><span>2026</span></h1>
  <p>I momenti più importanti dell'anno, in otto capitoli.</p>
</div>

<div class="stage" id="stage"></div>
<div class="label" id="label"></div>

<div class="veil" id="veil"></div>
<section class="detail" id="detail" aria-hidden="true">
  <div class="detail-head">
    <h2 id="d-title"></h2>
    <div class="meta"><span id="d-cat"></span><span id="d-month"></span></div>
  </div>
  <div class="detail-hero" id="d-hero"></div>
  <div class="detail-body">
    <strong id="d-lead"></strong>
    <p id="d-text"></p>
  </div>
</section>
<button class="close" id="close">Chiudi ✕</button>

<script>
/*
 * Le 8 card. Per usare una foto, imposta `img` con il percorso dell'immagine
 * (es. "img/gennaio.jpg"): prende il posto del gradiente.
 */
const CARDS = [
  { title: "Uno",     cat: "Evento",   month: "Gennaio",   img: "", bg: "linear-gradient(160deg,#f6d365,#fda085)" },
  { title: "Due",     cat: "Viaggio",  month: "Febbraio",  img: "", bg: "linear-gradient(160deg,#4facfe,#00f2fe)" },
  { title: "Tre",     cat: "Progetto", month: "Marzo",     img: "", bg: "linear-gradient(160deg,#43e97b,#38f9d7)" },
  { title: "Quattro", cat: "Persone",  month: "Aprile",    img: "", bg: "linear-gradient(160deg,#fa709a,#fee140)" },
  { title: "Cinque",  cat: "Evento",   month: "Giugno",    img: "", bg: "linear-gradient(160deg,#30cfd0,#330867)" },
  { title: "Sei",     cat: "Viaggio",  month: "Luglio",    img: "", bg: "linear-gradient(160deg,#a18cd1,#fbc2eb)" },
  { title: "Sette",   cat: "Progetto", month: "Settembre", img: "", bg: "linear-gradient(160deg,#ff9a9e,#8e2de2)" },
  { title: "Otto",    cat: "Persone",  month: "Dicembre",  img: "", bg: "linear-gradient(160deg,#232526,#bd4f6c)" },
];
const N = CARDS.length;
const bgOf = c => c.img ? `url("${c.img}")` : c.bg;

const stage = document.getElementById("stage");
const label = document.getElementById("label");

const els = CARDS.map((c, i) => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `<div class="media"></div><div class="num">${String(i + 1).padStart(2, "0")}</div>`;
  el.querySelector(".media").style.backgroundImage = bgOf(c);
  el.addEventListener("click", () => onCardClick(i));
  stage.appendChild(el);
  return el;
});

/*
 * Geometria della scala: ogni card è R volte più larga della precedente
 * e inizia esattamente dove finisce quella prima. Con t = posizione
 * relativa (0 = card attiva), il bordo sinistro è x(t) = x0 + A·(Rᵗ − 1),
 * così lo scorrimento è continuo e ogni card cresce mentre avanza.
 */
const R = 1.62;
let W, H, x0, w0, A;
function layout() {
  W = innerWidth; H = innerHeight;
  const mobile = W < 700;
  x0 = W * (mobile ? 0.22 : 0.26);
  w0 = W * (mobile ? 0.26 : 0.185);
  A = w0 / (R - 1);
}
addEventListener("resize", layout);
layout();

const xAt = t => x0 + A * (Math.pow(R, t) - 1);

let target = 0, pos = 0;
let lastActive = -1;

function wrapT(t) {
  // porta t nell'intervallo [-4.5, 3.5) così il giro è infinito
  return ((t + 4.5) % N + N) % N - 4.5;
}

function render() {
  pos += (target - pos) * 0.085;
  const maxH = H - 70;

  let activeIdx = 0, best = Infinity;
  els.forEach((el, i) => {
    const t = wrapT(i - pos);
    const x = xAt(t);
    const w = xAt(t + 1) - x;
    const h = Math.min(w * 1.02, maxH);
    // le card piccolissime in fondo a sinistra svaniscono prima del salto
    const fade = Math.min(1, Math.max(0, (t + 4.2) / 1.2));
    el.style.width = w + "px";
    el.style.height = h + "px";
    el.style.transform = `translate3d(${x}px,0,0)`;
    el.style.opacity = fade;
    el.style.zIndex = Math.round((t + 10) * 10);
    el.style.visibility = (x > W || w < 1) ? "hidden" : "visible";
    if (Math.abs(t) < best) { best = Math.abs(t); activeIdx = i; }
  });

  // etichetta sopra la card attiva
  const tA = wrapT(activeIdx - pos);
  const xA = xAt(tA), wA = xAt(tA + 1) - xA, hA = Math.min(wA * 1.02, maxH);
  label.style.transform = `translate3d(${xA}px, ${H - hA - 22}px, 0)`;
  if (activeIdx !== lastActive) {
    label.style.opacity = 0;
    setTimeout(() => { label.textContent = CARDS[activeIdx].title; label.style.opacity = 1; }, 150);
    lastActive = activeIdx;
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* ---------- Input: rotella, touch, tastiera ---------- */
let locked = false;
addEventListener("wheel", e => {
  if (locked) return;
  e.preventDefault();
  target += (e.deltaY + e.deltaX) / 420;
}, { passive: false });

let touchY = null;
addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive: true });
addEventListener("touchmove", e => {
  if (locked || touchY === null) return;
  const y = e.touches[0].clientY;
  target += (touchY - y) / 180;
  touchY = y;
}, { passive: true });
addEventListener("touchend", () => {
  touchY = null;
  target = Math.round(target);
});

// dopo lo scroll, aggancia dolcemente alla card più vicina
let snapTimer;
addEventListener("wheel", () => {
  clearTimeout(snapTimer);
  snapTimer = setTimeout(() => { target = Math.round(target); }, 180);
});

addEventListener("keydown", e => {
  if (e.key === "Escape") return closeDetail();
  if (locked) return;
  if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) target = Math.round(target) + 1;
  if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) target = Math.round(target) - 1;
});

/* ---------- Apertura dettaglio ---------- */
const veil = document.getElementById("veil");
const detail = document.getElementById("detail");
const closeBtn = document.getElementById("close");
const ease = "cubic-bezier(.7,0,.2,1)";

function onCardClick(i) {
  if (locked) return;
  const t = wrapT(i - pos);
  // clic su una card non attiva: la porta avanti
  if (Math.abs(t) > 0.5) { target = Math.round(target + t); return; }
  openDetail(i);
}

function openDetail(i) {
  locked = true;
  const c = CARDS[i];
  document.getElementById("d-title").textContent = c.title;
  document.getElementById("d-cat").textContent = c.cat;
  document.getElementById("d-month").textContent = c.month + " 2026";
  document.getElementById("d-lead").textContent = `${c.title} — ${c.month} 2026`;
  document.getElementById("d-text").textContent =
    "Racconta qui il momento: cosa è successo, chi c'era e perché è stato uno degli highlight dell'anno.";
  const hero = document.getElementById("d-hero");
  hero.style.backgroundImage = bgOf(c);
  hero.style.visibility = "hidden";
  detail.scrollTop = 0;

  const from = els[i].getBoundingClientRect();
  const fly = document.createElement("div");
  fly.className = "fly";
  fly.style.backgroundImage = bgOf(c);
  Object.assign(fly.style, { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" });
  document.body.appendChild(fly);

  veil.animate([{ opacity: 0 }, { opacity: .82 }, { opacity: 0 }],
    { duration: 1100, easing: "ease-in-out" });

  // la pagina di dettaglio entra a metà dell'oscuramento
  setTimeout(() => {
    detail.classList.add("open");
    detail.setAttribute("aria-hidden", "false");
    detail.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 500, fill: "both" });
    const to = hero.getBoundingClientRect();
    fly.animate([
      { left: from.left + "px", top: from.top + "px", width: from.width + "px", height: from.height + "px" },
      { left: to.left + "px", top: to.top + "px", width: to.width + "px", height: to.height + "px" }
    ], { duration: 800, easing: ease, fill: "forwards" }).onfinish = () => {
      hero.style.visibility = "visible";
      fly.remove();
      closeBtn.classList.add("show");
    };
    document.querySelectorAll("#d-title, .detail .meta").forEach((el, k) =>
      el.animate([{ opacity: 0, transform: "translateY(30px)" }, { opacity: 1, transform: "none" }],
        { duration: 700, delay: 250 + k * 90, easing: ease, fill: "both" }));
  }, 450);
}

function closeDetail() {
  if (!detail.classList.contains("open")) return;
  closeBtn.classList.remove("show");
  detail.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 450, fill: "both" }).onfinish = () => {
    detail.classList.remove("open");
    detail.setAttribute("aria-hidden", "true");
    locked = false;
  };
}
closeBtn.addEventListener("click", closeDetail);
</script>
</body>
</html>
